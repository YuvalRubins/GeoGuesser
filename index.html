<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>MapTap</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <div class="brand">
        <div class="logo">MAPTAP</div>
        <div class="tagline">Where is it?</div>
    </div>

    <div class="game-info">
        <div>
            ROUND
            <strong id="round">1</strong>/5
        </div>

        <div>
            SCORE
            <strong id="score">0</strong>
        </div>
    </div>
</header>


<main>

    <div id="map"></div>

    <div class="bottom-panel">

        <div class="question">
            Where is it?
        </div>

        <div class="instruction">
            Click anywhere on the map to place your guess
        </div>

        <button id="guessButton" disabled>
            GUESS
        </button>

    </div>

</main>


<!-- Result window -->

<div id="resultOverlay" class="overlay hidden">

    <div class="result-card">

        <div class="result-label">
            RESULT
        </div>

        <h2 id="locationName">
            Eiffel Tower
        </h2>

        <div class="points" id="points">
            +1000
        </div>

        <div class="distance" id="distance">
            0 km away
        </div>

        <button id="nextButton">
            NEXT
        </button>

    </div>

</div>


<!-- Final score -->

<div id="finalOverlay" class="overlay hidden">

    <div class="result-card">

        <div class="result-label">
            GAME COMPLETE
        </div>

        <div class="final-score" id="finalScore">
            5000
        </div>

        <div class="final-text">
            out of 5000 points
        </div>

        <button id="restartButton">
            PLAY AGAIN
        </button>

    </div>

</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
></script>

<script src="game.js"></script>

</body>
</html>
