<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MapTap</title>


    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >


    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =========================
     START SCREEN
========================= -->

<div
    id="startOverlay"
    class="overlay"
>

    <div class="result-card">

        <div class="result-label">
            MAPTAP
        </div>


        <h2>
            Ready to play?
        </h2>


        <div class="final-text">
            Find all the locations before
            time runs out.
        </div>


        <button id="startButton">
            START GAME
        </button>

    </div>

</div>



<!-- =========================
     TOP BAR
========================= -->

<header class="topbar">

    <div class="brand">

        <div class="logo">
            MAPTAP: Lilach and Yuval's Trip
        </div>

        <div class="tagline">
            Where is it?
        </div>

    </div>


    <div class="game-info">

        <div>
            ROUND
            <strong id="round">1</strong>/<strong id="totalRounds">0</strong>
        </div>


        <div>
            TIME
            <strong id="timer">30</strong>
        </div>


        <div>
            SCORE
            <strong id="score">0</strong>
        </div>

    </div>

</header>



<!-- =========================
     GAME
========================= -->

<main>

    <div id="map"></div>


    <div class="bottom-panel">


        <div
            id="question"
            class="question"
        >
        </div>


        <div class="instruction">
            Click the map to place your guess
        </div>


        <button
            id="guessButton"
            disabled
        >
            GUESS
        </button>


    </div>

</main>



<!-- =========================
     RESULT
========================= -->

<div
    id="resultOverlay"
    class="overlay hidden"
>

    <div class="result-card">


        <div class="result-label">
            RESULT
        </div>


        <h2 id="locationName">
        </h2>


        <div
            class="points"
            id="points"
        >
            +0
        </div>


        <div
            class="distance"
            id="distance"
        >
            0 km away
        </div>


        <button id="nextButton">
            NEXT
        </button>


    </div>

</div>



<!-- =========================
     FINAL SCORE
========================= -->

<div
    id="finalOverlay"
    class="overlay hidden"
>

    <div class="result-card">


        <div class="result-label">
            GAME COMPLETE
        </div>


        <div
            class="final-score"
            id="finalScore"
        >
            0
        </div>


        <div class="final-text">
            out of
            <span id="maxScore">0</span>
            points
        </div>


        <button id="restartButton">
            PLAY AGAIN
        </button>


    </div>

</div>



<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
></script>


<script src="game.js"></script>


</body>

</html>
